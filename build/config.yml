version: '3'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir: [.git, node_modules, frontend, build]
    file: ["*_test.go"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task dev:run
      type: primary
      exit_policy: shutdown
