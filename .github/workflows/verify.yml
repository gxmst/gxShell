name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  # The root package needs Wails/WebView2 and is Windows-first, but the backend
  # and CLI packages carry *_other.go variants that nothing compiled until now.
  # Building them on Linux keeps those files from silently rotting.
  verify-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build backend and CLI packages
        run: go build ./backend/... ./cmd/...

      - name: Vet backend and CLI packages
        run: go vet ./backend/... ./cmd/...
