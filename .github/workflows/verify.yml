name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # ESLint 10 and Vitest 4 both require 20.19+, so pinning the major to
          # 22 keeps CI off the edge of their engine ranges.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Lint and test before the build: both fail faster, and a build that
      # succeeds on code the linter rejects is not a useful signal.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go test
        # -race: the backend is goroutine-heavy (SSH sessions, tunnels,
        # terminal IO pumping, reconnect generations) and data races here
        # surface as rare user-visible corruption, not compile errors.
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      # govulncheck reports only vulnerabilities reachable from this code, so
      # it stays quiet until a shipped call path is actually affected.
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The root package needs Wails/WebView2 and is Windows-first, but the backend
  # and CLI packages carry *_other.go variants that nothing compiled until now.
  # Building them on Linux keeps those files from silently rotting.
  verify-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build backend and CLI packages
        run: go build ./backend/... ./cmd/...

      - name: Vet backend and CLI packages
        run: go vet ./backend/... ./cmd/...

  # Compile-only desktop targets. Windows remains the supported release
  # platform until the native integrations below receive runtime testing.
  build-linux-desktop-experimental:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install matching Wails CLI
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Build experimental Linux desktop app
        run: wails build -s -skipbindings -platform linux/amd64 -tags webkit2_41

      - name: Package experimental Linux build
        run: |
          VERSION="$(node -p "require('./frontend/package.json').version")"
          PACKAGE="gxShell-v${VERSION}-linux-amd64"
          mkdir -p "release/${PACKAGE}/CLI"
          install -m 0755 build/bin/gxShell "release/${PACKAGE}/gxShell"
          go build -o "release/${PACKAGE}/CLI/gxshell-cli" ./cmd/gxshell-cli
          cp docs/cli.md "release/${PACKAGE}/CLI/CLI-README.md"
          cp docs/cli.zh-CN.md "release/${PACKAGE}/CLI/CLI-README.zh-CN.md"
          cp docs/agent-guide.md "release/${PACKAGE}/CLI/agent-guide.md"
          cp LICENSE "release/${PACKAGE}/LICENSE"
          tar -C release -czf "release/${PACKAGE}.tar.gz" "${PACKAGE}"
          (cd release && sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256")

      - name: Upload experimental Linux build
        uses: actions/upload-artifact@v4
        with:
          name: gxshell-linux-amd64
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-macos-desktop-experimental:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install matching Wails CLI
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Build experimental macOS desktop app
        run: wails build -s -skipbindings -platform darwin/arm64

      - name: Package experimental macOS build
        run: |
          VERSION="$(node -p "require('./frontend/package.json').version")"
          PACKAGE="gxShell-v${VERSION}-macos-arm64"
          mkdir -p "release/${PACKAGE}/CLI"
          cp -R build/bin/gxShell.app "release/${PACKAGE}/gxShell.app"
          go build -o "release/${PACKAGE}/CLI/gxshell-cli" ./cmd/gxshell-cli
          cp docs/cli.md "release/${PACKAGE}/CLI/CLI-README.md"
          cp docs/cli.zh-CN.md "release/${PACKAGE}/CLI/CLI-README.zh-CN.md"
          cp docs/agent-guide.md "release/${PACKAGE}/CLI/agent-guide.md"
          cp LICENSE "release/${PACKAGE}/LICENSE"
          ditto -c -k --sequesterRsrc --keepParent "release/${PACKAGE}" "release/${PACKAGE}.zip"
          (cd release && shasum -a 256 "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256")

      - name: Upload experimental macOS build
        uses: actions/upload-artifact@v4
        with:
          name: gxshell-macos-arm64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 7
