name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag version
        shell: pwsh
        run: |
          $source = Get-Content backend/version/version.go -Raw
          if ($source -notmatch 'const\s+Version\s*=\s*"([^"]+)"') {
            throw 'Could not read backend/version/version.go version'
          }
          $version = $Matches[1]
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version $version"
          }
          Write-Output "Releasing gxShell v$version"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go test
        # Matches verify.yml; a release must not go out on a race-dirty tree.
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Install matching Wails CLI
        shell: pwsh
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"

      # -skipbindings, as in verify.yml: frontend/wailsjs is hand-maintained, and
      # regenerating it reverts the corrections check-bindings.mjs asserts. Wails
      # regenerates before compiling the frontend, so without this flag the
      # bindings check inside npm run build fails the release build every time.
      - name: Build Windows desktop app
        run: wails build -clean -skipbindings

      - name: Build CLI
        run: go build -o gxshell-cli.exe ./cmd/gxshell-cli

      - name: Package release
        shell: pwsh
        run: |
          $source = Get-Content backend/version/version.go -Raw
          $null = $source -match 'const\s+Version\s*=\s*"([^"]+)"'
          $version = $Matches[1]
          $stage = Join-Path $env:RUNNER_TEMP 'gxshell-release-stage'
          $cliStage = Join-Path $stage 'CLI'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path $cliStage | Out-Null
          Copy-Item build/bin/gxShell.exe (Join-Path $stage 'gxShell.exe')
          Copy-Item gxshell-cli.exe (Join-Path $cliStage 'gxshell-cli.exe')
          Copy-Item docs/cli.md (Join-Path $cliStage 'CLI-README.md')
          Copy-Item docs/cli.zh-CN.md (Join-Path $cliStage 'CLI-README.zh-CN.md')
          Copy-Item docs/agent-guide.md (Join-Path $cliStage 'agent-guide.md')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          $manifest = @(
            'gxShell release build manifest',
            "version: $version",
            "commit: $env:GITHUB_SHA",
            'platform: windows/amd64',
            "built_at_utc: $((Get-Date).ToUniversalTime().ToString('o'))",
            'assets:',
            '  gxShell.exe',
            '  CLI/gxshell-cli.exe',
            '  CLI/CLI-README.md',
            '  CLI/CLI-README.zh-CN.md',
            '  CLI/agent-guide.md',
            '  LICENSE',
            '  BUILD-MANIFEST.txt'
          )
          # LF, no BOM, via WriteAllText: Set-Content would write CRLF on
          # Windows. The manifest is a cosmetic difference, but the checksum
          # file below must be LF or "sha256sum -c SHA256SUMS.txt" fails on
          # Linux/macOS/WSL/Git Bash with "No such file or directory" -- it
          # takes the trailing \r as part of the file name. That command is the
          # verification step README.md and docs/releasing.md tell users to run.
          $lf = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $stage 'BUILD-MANIFEST.txt'), (($manifest -join "`n") + "`n"), $lf)
          $package = "gxShell-v$version-windows-amd64.zip"
          $inputs = @(Get-ChildItem -LiteralPath $stage | Select-Object -ExpandProperty FullName)
          Compress-Archive -LiteralPath $inputs -DestinationPath $package -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          # Absolute path: .NET resolves a relative path against the process
          # working directory, which does not follow PowerShell's location.
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$hash  $package`n", $lf)
          Write-Output "PACKAGE=$package"
          Get-ChildItem -LiteralPath $stage -File -Recurse | Select-Object FullName,Length
          Get-Item $package,SHA256SUMS.txt | Select-Object Name,Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content backend/version/version.go -Raw
          $null = $source -match 'const\s+Version\s*=\s*"([^"]+)"'
          $version = $Matches[1]
          $lines = @(Get-Content CHANGELOG.md)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
              $start = $i
              break
            }
          }
          if ($start -lt 0) { throw "No CHANGELOG section found for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') {
              $end = $i
              break
            }
          }
          # Drop the "## [x.y.z] - date" heading (the release title already says
          # it) and the trailing "[x.y.z]: <url>" link definition (it points at
          # this very release).
          $section = @($lines[($start + 1)..($end - 1)] | Where-Object { $_ -notmatch '^\[[0-9]' })
          $changes = (($section -join "`n").Trim())
          $tick = [char]0x60
          # An array joined with newlines rather than a here-string: a here-string
          # terminator cannot be indented, and every line here is indented by the
          # YAML block scalar. Indented body lines would also render as a Markdown
          # code block on the release page.
          $body = @(
            '## Download',
            '',
            "Download ${tick}gxShell-v$version-windows-amd64.zip${tick}. The desktop app is at the archive root; the optional CLI, English and Chinese CLI documentation, and agent safety guide are grouped under ${tick}CLI/${tick}. The CLI server is disabled by default.",
            '',
            '## Changes',
            '',
            $changes,
            '',
            '## Verify',
            '',
            "Compare the zip SHA-256 with ${tick}SHA256SUMS.txt${tick} before extracting it.",
            '',
            '## Requirements',
            '',
            'Windows 10/11 x64 and Microsoft WebView2 Runtime. Linux and macOS desktop builds remain experimental CI artifacts.'
          ) -join "`n"
          $notes = Join-Path $env:RUNNER_TEMP 'gxshell-release-notes.md'
          $body | Set-Content $notes -Encoding utf8
          $package = "gxShell-v$version-windows-amd64.zip"
          gh release create "${{ github.ref_name }}" $package SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --title "gxShell v$version" `
            --notes-file $notes `
            --verify-tag `
            --latest
